syntax = "proto3";

package com.example.acmewidgets.auth.v1;

option java_package = "com.example.acmewidgets.auth.v1";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "widget_common.proto";

message ApiCredential {
  string tenant_key = 1;
  string credential_id = 2;
  string jwk_json = 3;
  string source_warehouse = 4;
  google.protobuf.Timestamp deleted_time = 5;
  google.protobuf.Timestamp updated_time = 6;
}

message ApiCredentialSyncResponse {
  com.example.acmewidgets.common.v1.CatalogSyncHeader header = 1;
  repeated ApiCredential credentials = 2;
}
